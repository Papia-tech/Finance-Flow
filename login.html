<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FinanceFlow | Authentication</title>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #ffffff;
            --primary: #6ab085; /* Sage Green */
            --dark-card: #1a1a1a;
            --text-main: #2d3436;
            --text-muted: #a0a0a0;
            --soft-bg: #f8faf9;
            --border-light: #f0f0f0;
            --accent-blob: rgba(106, 176, 133, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #fdfdfd;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: var(--bg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
            overflow: hidden;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
        }

        /* --- Random Blob Pseudo-element --- */
        #app::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 350px;
            height: 350px;
            background-color: var(--accent-blob);
            border-radius: 40% 60% 70% 30% / 50% 60% 30% 70%;
            z-index: 0;
            mix-blend-mode: multiply;
            transform: rotate(20deg);
        }

        .auth-header {
            z-index: 10;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .auth-header h1 {
            font-size: 32px;
            font-weight: 800;
            color: var(--dark-card);
            margin-bottom: 8px;
        }

        .auth-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-container {
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 16px 15px 16px 45px;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            background: var(--soft-bg);
            font-size: 15px;
            outline: none;
            color: var(--text-main);
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .action-button {
            width: 100%;
            padding: 18px;
            background: var(--dark-card);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-button:active {
            transform: scale(0.98);
        }

        .toggle-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-muted);
            z-index: 10;
        }

        .toggle-text span {
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            font-weight: 500;
        }

        /* Loading spinner */
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="auth-header">
            <h1 id="title">Welcome Back</h1>
            <p id="subtitle">Log in to manage your finances</p>
        </div>

        <div class="form-container">
            <div class="input-group">
                <i data-lucide="user" size="20"></i>
                <input type="text" id="username" placeholder="Username" autocomplete="off">
            </div>

            <div class="input-group">
                <i data-lucide="lock" size="20"></i>
                <input type="password" id="password" placeholder="Password">
            </div>

            <div class="error-message" id="errorMsg"></div>

            <button class="action-button" id="submitBtn">
                <span id="btnText">Log In</span>
                <span class="loader" id="loader" style="display: none;"></span>
            </button>
        </div>

        <div class="toggle-text">
            <span id="toggleTextMsg">Don't have an account?</span> <span id="toggleModeBtn">Sign Up</span>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Redirect immediately if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }

        let isLoginMode = true;

        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const btnText = document.getElementById('btnText');
        const toggleModeBtn = document.getElementById('toggleModeBtn');
        const toggleTextMsg = document.getElementById('toggleTextMsg');
        const submitBtn = document.getElementById('submitBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const loader = document.getElementById('loader');

        toggleModeBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            errorMsg.textContent = '';
            
            if (isLoginMode) {
                title.textContent = 'Welcome Back';
                subtitle.textContent = 'Log in to manage your finances';
                btnText.textContent = 'Log In';
                toggleTextMsg.textContent = "Don't have an account?";
                toggleModeBtn.textContent = 'Sign Up';
            } else {
                title.textContent = 'Create Account';
                subtitle.textContent = 'Start your journey with us';
                btnText.textContent = 'Sign Up';
                toggleTextMsg.textContent = "Already have an account?";
                toggleModeBtn.textContent = 'Log In';
            }
        });

        submitBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                errorMsg.textContent = 'Please fill in all fields';
                return;
            }

            errorMsg.textContent = '';
            btnText.style.display = 'none';
            loader.style.display = 'block';

            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
            const API_BASE = "https://finance-flow-fc9r.onrender.com";
            const url = `${API_BASE}${endpoint}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorMsg.textContent = data.error || 'Something went wrong';
                } else {
                    if (isLoginMode) {
                        // Save token and redirect
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('username', username);
                        window.location.href = 'dashboard.html';
                    } else {
                        // Registration successful, switch to login
                        errorMsg.style.color = 'var(--primary)';
                        errorMsg.textContent = 'Registration successful! Please log in.';
                        setTimeout(() => {
                            errorMsg.style.color = '#e74c3c';
                            toggleModeBtn.click(); // Switch to login mode
                        }, 1500);
                    }
                }
            } catch (err) {
                errorMsg.textContent = 'Failed to connect to server. Is the backend running?';
                console.error(err);
            } finally {
                btnText.style.display = 'block';
                loader.style.display = 'none';
            }
        });
    </script>
</body>

</html>
