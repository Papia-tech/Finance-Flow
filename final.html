<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFlow | Minimal Tracker</title>
    <!-- Lucide Icons for a clean look -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #ffffff;
            --card: #f8f9fa;
            --primary: #1a1a1a;
            --accent: #2ecc71;
            --text-main: #1a1a1a;
            --text-muted: #7f8c8d;
            --danger: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            padding-bottom: 100px;
        }

        /* Header & Illustration */
        header {
            margin-top: 20px;
            animation: fadeInDown 0.8s ease-out;
        }

        .welcome-text h1 {
            font-size: 28px;
            font-weight: 800;
        }

        .illustration-container {
            width: 100%;
            height: 200px;
            margin: 20px 0;
            background: url('Screenshot 2026-04-30 122921.png') no-repeat center;
            background-size: contain;
        }

        /* Balance Card */
        .balance-card {
            background: var(--primary);
            color: white;
            padding: 30px;
            border-radius: 24px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .balance-card:active {
            transform: scale(0.98);
        }

        .balance-label {
            font-size: 14px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 700;
            margin-top: 5px;
        }

        /* Transactions List */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transaction-item {
            background: var(--card);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideInRight 0.4s ease-out;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-details p {
            font-weight: 600;
            font-size: 15px;
        }

        .item-details span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .amount.expense { color: var(--danger); }
        .amount.income { color: var(--accent); }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 100;
        }

        /* Modal / Bottom Sheet */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 200;
        }

        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 30px 30px 0 0;
            padding: 30px;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 201;
        }

        .bottom-sheet.active {
            bottom: 0;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 12px;
            font-size: 16px;
            margin-top: 8px;
            background: #fdfdfd;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .empty-state {
            text-align: center;
            margin-top: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div id="app">
    <header>
        <div class="welcome-text">
            <p style="color: var(--text-muted);">Hello there,</p>
            <h1 id="user-greeting">My Finances</h1>
        </div>
        <div class="illustration-container"></div>
    </header>

    <div class="balance-card">
        <p class="balance-label">Total Balance</p>
        <p class="balance-amount" id="total-balance">$0.00</p>
    </div>

    <div class="section-header">
        <h3>Transactions</h3>
        <span style="font-size: 12px; color: var(--accent); font-weight: bold;">View All</span>
    </div>

    <div class="transaction-list" id="transaction-list">
        <!-- JS will populate this -->
        <div class="empty-state">No transactions yet. Tap the + to start!</div>
    </div>

    <div class="fab" onclick="toggleModal(true)">
        <i data-lucide="plus"></i>
    </div>
</div>

<!-- Add Transaction Sheet -->
<div class="modal-overlay" id="overlay" onclick="toggleModal(false)"></div>
<div class="bottom-sheet" id="sheet">
    <h2 style="margin-bottom: 20px;">Add Transaction</h2>
    <div class="input-group">
        <label>Description</label>
        <input type="text" id="desc" placeholder="e.g. Grocery, Salary">
    </div>
    <div class="input-group">
        <label>Amount</label>
        <input type="number" id="amount" placeholder="0.00">
    </div>
    <div class="input-group">
        <label>Type</label>
        <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
        </select>
    </div>
    <button class="btn-submit" onclick="addTransaction()">Save Transaction</button>
</div>

<script>
    // Initialize Icons
    lucide.createIcons();

    let transactions = JSON.parse(localStorage.getItem('my_finances')) || [];

    function updateUI() {
        const list = document.getElementById('transaction-list');
        const balanceDisplay = document.getElementById('total-balance');
        
        list.innerHTML = '';
        
        if (transactions.length === 0) {
            list.innerHTML = '<div class="empty-state">No transactions yet.</div>';
            balanceDisplay.innerText = '$0.00';
            return;
        }

        let total = 0;

        transactions.forEach((t, index) => {
            const isExpense = t.type === 'expense';
            total += isExpense ? -parseFloat(t.amount) : parseFloat(t.amount);

            const div = document.createElement('div');
            div.className = 'transaction-item';
            div.innerHTML = `
                <div class="item-info">
                    <div class="icon-box">
                        <i data-lucide="${isExpense ? 'arrow-down-right' : 'arrow-up-right'}" 
                           style="color: ${isExpense ? '#e74c3c' : '#2ecc71'}"></i>
                    </div>
                    <div class="item-details">
                        <p>${t.desc}</p>
                        <span>${new Date(t.date).toLocaleDateString()}</span>
                    </div>
                </div>
                <div style="text-align: right">
                    <p class="amount ${t.type}">${isExpense ? '-' : '+'}$${Math.abs(t.amount).toFixed(2)}</p>
                    <span onclick="deleteItem(${index})" style="font-size: 10px; color: #ccc; cursor: pointer;">Remove</span>
                </div>
            `;
            list.appendChild(div);
        });

        balanceDisplay.innerText = `$${total.toFixed(2)}`;
        lucide.createIcons();
        localStorage.setItem('my_finances', JSON.stringify(transactions));
    }

    function toggleModal(show) {
        const sheet = document.getElementById('sheet');
        const overlay = document.getElementById('overlay');
        if (show) {
            overlay.style.display = 'block';
            setTimeout(() => sheet.classList.add('active'), 10);
        } else {
            sheet.classList.remove('active');
            setTimeout(() => overlay.style.display = 'none', 400);
        }
    }

    function addTransaction() {
        const desc = document.getElementById('desc').value;
        const amount = document.getElementById('amount').value;
        const type = document.getElementById('type').value;

        if (!desc || !amount) return alert("Please fill details");

        transactions.unshift({
            desc,
            amount: parseFloat(amount),
            type,
            date: new Date()
        });

        updateUI();
        toggleModal(false);
        
        // Clear inputs
        document.getElementById('desc').value = '';
        document.getElementById('amount').value = '';
    }

    function deleteItem(index) {
        transactions.splice(index, 1);
        updateUI();
    }

    // Initial Load
    updateUI();
</script>

</body>
</html>
